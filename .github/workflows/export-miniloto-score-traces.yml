name: Export Mini Loto score traces

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/export_miniloto_score_traces.py'
      - '.github/workflows/export-miniloto-score-traces.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-score-traces
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/export_miniloto_score_traces.py
      - name: Commit score traces
        run: |
          FILE=data/miniloto-score-traces-1200-1399.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'No trace changes.'
            exit 0
          fi
          git commit -m 'Update Mini Loto score traces'
          git pull --rebase origin main
          git push origin HEAD:main
