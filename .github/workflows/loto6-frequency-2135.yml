name: Loto6 Frequency Audit 2135
on:
  push:
    paths:
      - 'research/loto6_frequency_mean_reversion_2135.py'
      - '.github/workflows/loto6-frequency-2135.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_frequency_mean_reversion_2135.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-frequency-2135
          path: research/results/loto6_frequency_mean_reversion_2135.json
