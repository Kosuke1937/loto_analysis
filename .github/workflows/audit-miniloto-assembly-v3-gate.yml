name: Audit Mini Loto Assembly v3 Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/audit_miniloto_assembly_v3_gate.py'
      - '.github/workflows/audit-miniloto-assembly-v3-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-assembly-v3-gate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_assembly_v3_gate.py
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-assembly-v3-gate-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Mini Loto Assembly v3 gate audit'
          git pull --rebase origin main
          git push origin HEAD:main
