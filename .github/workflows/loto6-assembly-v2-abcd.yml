name: Loto6 Assembly v2 ABCD

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_assembly_v2_abcd.py'
      - '.github/workflows/loto6-assembly-v2-abcd.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run Assembly v2 ABCD validation
        run: python research/loto6_assembly_v2_abcd.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-assembly-v2-abcd-result
          path: research/results/loto6_assembly_v2_abcd_summary.json
