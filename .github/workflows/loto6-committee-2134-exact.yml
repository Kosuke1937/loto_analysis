name: Loto6 Committee 2134 Exact
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_committee_2134_exact.py'
      - '.github/workflows/loto6-committee-2134-exact.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_committee_2134_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-committee-2134-exact
          path: research/results/loto6_committee_2134_exact.json
