name: Loto6 2138 multihorizon band predictor
on:
  push:
    paths:
      - 'research/loto6_2138_multihorizon_band_predict.py'
      - '.github/workflows/loto6-2138-multihorizon-band-predict.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Run multihorizon predictor
        run: python research/loto6_2138_multihorizon_band_predict.py > /tmp/out.json
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/loto6_2138_multihorizon_band_predict.json
          git diff --cached --quiet || git commit -m 'Add Loto6 2138 multihorizon band prediction result'
          git push
