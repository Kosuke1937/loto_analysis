name: Loto6 Portfolio Multilane v1
on:
  push:
    paths:
      - 'research/loto6_portfolio_multilane_v1.py'
      - '.github/workflows/loto6-portfolio-multilane-v1.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_portfolio_multilane_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-portfolio-multilane-v1-result
          path: research/results/loto6_portfolio_multilane_v1_summary.json
