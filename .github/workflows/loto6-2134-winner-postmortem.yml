name: Loto6 2134 Winner Postmortem
on:
  push:
    paths:
      - 'research/loto6_2134_winner_postmortem.py'
      - '.github/workflows/loto6-2134-winner-postmortem.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_2134_winner_postmortem.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-2134-winner-postmortem
          path: research/results/loto6_2134_winner_postmortem.json
