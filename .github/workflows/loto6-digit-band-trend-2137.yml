name: Loto6 digit-band trend 2137
on:
  push:
    paths:
      - 'research/loto6_digit_band_trend_2137.py'
      - '.github/workflows/loto6-digit-band-trend-2137.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Run digit-band trend analysis
        run: python research/loto6_digit_band_trend_2137.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/loto6_digit_band_trend_2137.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add Loto6 digit-band trend result"
            git push
          fi
