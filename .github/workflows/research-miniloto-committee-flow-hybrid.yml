name: Research Mini Loto Committee flow hybrid

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_committee_flow_hybrid.py'
      - '.github/workflows/research-miniloto-committee-flow-hybrid.yml'
      - 'data/miniloto-chunk-*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_committee_flow_hybrid.py
      - name: Commit backtest result
        run: |
          set -e
          FILE=data/miniloto-committee-flow-hybrid-backtest.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Mini Loto Committee-flow hybrid backtest'
          git pull --rebase origin main
          git push origin HEAD:main
