name: Render Mini Loto score PNGs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_miniloto_score_pngs.py'
      - '.github/workflows/render-miniloto-score-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check matplotlib
      - run: python scripts/render_miniloto_score_pngs.py
      - name: Commit PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add docs/score_pngs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Mini Loto score PNGs'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
