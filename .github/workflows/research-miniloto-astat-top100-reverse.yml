name: Research Mini Loto A-Stat Top100 Reverse
on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_miniloto_astat_top100_reverse.py'
      - '.github/workflows/research-miniloto-astat-top100-reverse.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_astat_top100_reverse.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-astat-top100-reverse-800-1399.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A-Stat Top100 reverse results'
          git pull --rebase origin main
          git push origin HEAD:main
