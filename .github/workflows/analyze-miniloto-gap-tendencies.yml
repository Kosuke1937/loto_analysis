name: Analyze Mini Loto Gap Tendencies
on:
  push:
    paths:
      - 'scripts/analyze_miniloto_gap_tendencies.py'
      - '.github/workflows/analyze-miniloto-gap-tendencies.yml'
      - 'data/miniloto-chunk-*.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python scripts/analyze_miniloto_gap_tendencies.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-gap-tendencies.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add Mini Loto gap tendency analysis results'
            git push
          fi
