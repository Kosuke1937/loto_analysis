name: Update Loto6 2134 App
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/update_loto6_2134_app.py'
      - '.github/workflows/update-loto6-2134-app.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/update_loto6_2134_app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html loto6.html loto6-history.html loto6-trends.html loto6-records.html loto6-development.html loto6-roadmap.html data/loto6-chunk-12.js data/loto6-meta.json data/loto6-purchase-2134.json data/loto6-analysis-2134.json
          git diff --cached --quiet || git commit -m "Update Loto6 app for draw 2134 and purchased tickets"
          git push
