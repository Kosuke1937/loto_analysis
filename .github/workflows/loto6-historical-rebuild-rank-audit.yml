name: Loto6 Historical Rebuild Rank Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_historical_rebuild_rank_audit.py'
      - '.github/workflows/loto6-historical-rebuild-rank-audit.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_historical_rebuild_rank_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-historical-rebuild-rank-audit
          path: research/results/loto6_historical_rebuild_rank_audit.json
