name: Update Mini Loto Development Pair Triple Audit
on:
  push:
    paths:
      - 'scripts/update_miniloto_development_pair_triple_audit.py'
      - '.github/workflows/update-miniloto-development-pair-triple-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_miniloto_development_pair_triple_audit.py
      - name: Commit app update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniloto-development.html
          git diff --cached --quiet || git commit -m 'Update Mini Loto development with pair triple audit'
          git push
