name: Audit Mini Loto Assembly v1

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/audit_miniloto_assembly_v1.py'
      - '.github/workflows/audit-miniloto-assembly-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-assembly-v1-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_assembly_v1.py
      - name: Commit audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-assembly-v1-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m 'Update Mini Loto Assembly v1 audit'
          git pull --rebase origin main
          git push origin HEAD:main
