name: Research Mini Loto Committee flow partial hybrid

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_committee_flow_partial_hybrid.py'
      - '.github/workflows/research-miniloto-committee-flow-partial-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-committee-flow-partial-hybrid
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_committee_flow_partial_hybrid.py
      - name: Commit backtest result
        run: |
          set -e
          FILE=data/miniloto-committee-flow-partial-hybrid-backtest.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update partial Committee-flow hybrid backtest'
          git pull --rebase origin main
          git push origin HEAD:main
