name: Loto6 Poolsize Portfolio Fixed10 BO Excluded
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_poolsize_portfolio_fixed10_boexcluded.py'
      - '.github/workflows/loto6-poolsize-portfolio-fixed10-boexcluded.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_poolsize_portfolio_fixed10_boexcluded.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-poolsize-portfolio-fixed10-boexcluded
          path: research/results/loto6_poolsize_portfolio_fixed10_boexcluded.json
