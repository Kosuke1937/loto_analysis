name: Loto6 2135 Candidate Pipeline
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_committee_2135_exact.py'
      - 'research/loto6_hist_rebuild_2135.py'
      - '.github/workflows/loto6-2135-candidates.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_committee_2135_exact.py
      - run: python research/loto6_hist_rebuild_2135.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-2135-candidates
          path: |
            research/results/loto6_committee_2135_exact.json
            research/results/loto6_hist_rebuild_2135.json
