name: Loto6 Committee Winner Scoreband Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_committee_winner_scoreband_1628_2134.py'
      - '.github/workflows/loto6-committee-scoreband-backtest.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_committee_winner_scoreband_1628_2134.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-committee-scoreband-backtest
          path: research/results/loto6_committee_winner_scoreband_1628_2134.json
