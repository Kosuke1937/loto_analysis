name: Loto6 Pool Shell Rescue v4

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_pool_shell_rescue_v4.py'
      - '.github/workflows/loto6-pool-shell-rescue-v4.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Run shell rescue validation
        run: python research/loto6_pool_shell_rescue_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-pool-shell-rescue-v4-result
          path: research/results/loto6_pool_shell_rescue_v4_summary.json
