name: Audit Mini Loto Assembly v4 Crosscluster
on:
  push:
    paths:
      - 'scripts/audit_miniloto_assembly_v4_crosscluster.py'
      - '.github/workflows/audit-miniloto-assembly-v4-crosscluster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_assembly_v4_crosscluster.py
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/miniloto-assembly-v4-crosscluster-audit.json
          git diff --cached --quiet || git commit -m "Add Mini Loto Assembly v4 cross-cluster audit result"
          git push