name: Compact tables UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compact-tables.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact tables
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '/* compact-table-ui-v1 */'
          css = '''/* compact-table-ui-v1 */
          table{table-layout:auto}
          th,td{padding:5px 7px!important;line-height:1.2!important;height:auto!important;min-height:0!important}
          th{font-weight:700}
          .tablewrap,.tableWrap{max-width:100%;-webkit-overflow-scrolling:touch}
          @media(max-width:560px){
          .tablewrap,.tableWrap{border-radius:10px!important}
          table{min-width:0!important;width:100%!important}
          th,td{padding:4px 5px!important;font-size:10px!important;line-height:1.15!important}
          th{font-size:9.5px!important}
          #number table{table-layout:fixed!important}
          #number th,#number td{text-align:center!important}
          #number th:nth-child(1),#number td:nth-child(1){width:16%!important}
          #number th:nth-child(2),#number td:nth-child(2){width:22%!important}
          #number th:nth-child(3),#number td:nth-child(3){width:28%!important}
          #number th:nth-child(4),#number td:nth-child(4){width:34%!important}
          .record table{min-width:520px!important}
          }'''
          changed = []
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if '<table' not in s or marker in s:
                  continue
              if '</style>' in s:
                  s = s.replace('</style>', css + '</style>', 1)
              elif '</head>' in s:
                  s = s.replace('</head>', '<style>' + css + '</style></head>', 1)
              else:
                  continue
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          print('updated:', changed)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact table UI across app pages'
          git push
