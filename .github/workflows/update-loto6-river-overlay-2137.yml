name: Update Loto6 River Overlay 2137

on:
  push:
    paths:
      - 'research/update_loto6_river_overlay_2137.py'
      - '.github/workflows/update-loto6-river-overlay-2137.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Overlay previous forecast on latest draw row
        run: python research/update_loto6_river_overlay_2137.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION loto6-river.html '*.html'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Overlay previous forecast on latest Loto6 row"
            git push
          fi
