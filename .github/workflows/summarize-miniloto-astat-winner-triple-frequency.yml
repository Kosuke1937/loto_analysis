name: Summarize Mini Loto A-Stat Winner Triple Frequency
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/summarize_miniloto_astat_winner_triple_frequency.py'
      - '.github/workflows/summarize-miniloto-astat-winner-triple-frequency.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/summarize_miniloto_astat_winner_triple_frequency.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-astat-top100-winner-triple-frequency-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update compact A-Stat winner triple frequency summary'
          git pull --rebase origin main
          git push origin HEAD:main
