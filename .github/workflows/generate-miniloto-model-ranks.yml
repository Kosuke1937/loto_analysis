name: Generate Mini Loto model ranks

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/generate_miniloto_model_ranks.py'
      - '.github/workflows/generate-miniloto-model-ranks.yml'
      - 'data/miniloto-chunk-*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/generate_miniloto_model_ranks.py
      - name: Commit generated rank data
        run: |
          if git diff --quiet -- data/miniloto-model-ranks-1200-1399.js; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-model-ranks-1200-1399.js
          git commit -m 'Generate Mini Loto model rank data'
          git push
