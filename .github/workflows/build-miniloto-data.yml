name: Build Mini Loto data
on:
  push:
    branches: [main]
    paths:
      - 'miniloto-history.html'
      - 'generate_miniloto_data.py'
      - '.github/workflows/build-miniloto-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate_miniloto_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniloto-data.json
          git diff --cached --quiet || git commit -m "Generate Mini Loto history JSON"
          git push
