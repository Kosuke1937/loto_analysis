name: Update Mini Loto River Next Candidates
on:
  push:
    paths:
      - 'scripts/update_miniloto_river_next_candidates.py'
      - '.github/workflows/update-miniloto-river-next-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_miniloto_river_next_candidates.py
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniloto-river.html
          git diff --cached --quiet || git commit -m 'Show next Mini Loto flow candidates and outside numbers'
          git push
