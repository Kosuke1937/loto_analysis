name: Loto6 Consensus Phase3 Cascade

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_consensus_phase3_cascade.py'
      - '.github/workflows/loto6-consensus-phase3-cascade.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run Phase3 cascade diagnostic
        run: python research/loto6_consensus_phase3_cascade.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-consensus-phase3-cascade-result
          path: research/results/loto6_consensus_phase3_cascade_summary.json
