name: Research Mini Loto A-Stat Top100 Winner Triple Frequency
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_astat_top100_winner_triple_frequency.py'
      - '.github/workflows/research-miniloto-astat-top100-winner-triple-frequency.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_astat_top100_winner_triple_frequency.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git checkout -- data/miniloto-committee-v2-research.json 2>/dev/null || true
          git add data/miniloto-astat-top100-winner-triple-frequency.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A-Stat Top100 winner triple frequency'
          git pull --rebase origin main
          git push origin HEAD:main
