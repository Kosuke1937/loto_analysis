name: Summarize Mini Loto A-Dynamic Density

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/summarize_miniloto_a_dynamic_density.py'
      - '.github/workflows/summarize-miniloto-a-dynamic-density.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/summarize_miniloto_a_dynamic_density.py
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-a-dynamic-density-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A-Dynamic density summary'
          git pull --rebase origin main
          git push origin HEAD:main
