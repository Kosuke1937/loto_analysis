name: Build Loto6 history
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_loto6_history.py'
      - '.github/workflows/build-loto6-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_loto6_history.py
      - name: Commit generated Loto6 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loto6-chunk-*.js data/loto6-meta.json
          git diff --cached --quiet || git commit -m "Generate Loto6 history data"
          git push
