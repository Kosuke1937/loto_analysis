name: Update Mini Loto Development vNext Result
on:
  push:
    paths:
      - 'scripts/update_miniloto_development_vnext_result.py'
      - '.github/workflows/update-miniloto-development-vnext-result.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_miniloto_development_vnext_result.py
      - name: Commit app update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniloto-development.html
          git diff --cached --quiet || git commit -m 'Update Mini Loto development with Assembly vNext audit'
          git push
