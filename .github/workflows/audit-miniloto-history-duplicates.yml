name: Audit Mini Loto History Duplicates
on:
  push:
    paths:
      - 'scripts/audit_miniloto_history_duplicates.py'
      - '.github/workflows/audit-miniloto-history-duplicates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_miniloto_history_duplicates.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-history-duplicate-audit.json
          git diff --cached --quiet || git commit -m 'Audit Mini Loto exact duplicate history'
          git push
