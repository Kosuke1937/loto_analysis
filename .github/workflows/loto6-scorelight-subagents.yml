name: Loto6 Scorelight Subagents Compare
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_scorelight_subagents_compare.py'
      - '.github/workflows/loto6-scorelight-subagents.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_scorelight_subagents_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-scorelight-subagents
          path: research/results/loto6_scorelight_subagents_compare.json
