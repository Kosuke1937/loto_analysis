name: Loto6 Consensus Phase1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_consensus_phase1_sample.py'
      - '.github/workflows/loto6-consensus-phase1.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run frozen phase1 backtest
        run: python research/loto6_consensus_phase1_sample.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-consensus-phase1-result
          path: research/results/loto6_consensus_phase1_summary.json
