name: Loto6 2138 Outside Transition
on:
  push:
    paths:
      - 'research/loto6_2138_outside_transition.py'
      - '.github/workflows/loto6-2138-outside-transition.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: pip install numpy
      - name: Run analysis
        run: python research/loto6_2138_outside_transition.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/loto6_2138_outside_transition.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add Loto6 2138 outside-transition result"
            git push
          fi
