name: Loto6 Reduced Pool ABCD v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_reduced_pool_abcd_v1.py'
      - '.github/workflows/loto6-reduced-pool-abcd-v1.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run reduced-pool ABCD validation
        run: python research/loto6_reduced_pool_abcd_v1.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-reduced-pool-abcd-v1-result
          path: research/results/loto6_reduced_pool_abcd_v1_summary.json
