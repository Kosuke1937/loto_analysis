name: Loto6 Scenario Assembly v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_scenario_assembly_v2.py'
      - '.github/workflows/loto6-scenario-assembly-v2.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_scenario_assembly_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-scenario-assembly-v2-result
          path: research/results/loto6_scenario_assembly_v2_summary.json
