name: Loto6 Today 2133
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_today_2133_generator.py'
      - '.github/workflows/loto6-today-2133.yml'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_today_2133_generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-today-2133-result
          path: research/results/loto6_today_2133_candidates.json
