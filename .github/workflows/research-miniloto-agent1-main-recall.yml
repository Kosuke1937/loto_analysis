name: Research Mini Loto Agent1 Main recall

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_agent1_main_recall.py'
      - '.github/workflows/research-miniloto-agent1-main-recall.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-agent1-main-recall
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_agent1_main_recall.py
      - name: Commit result
        run: |
          FILE=data/miniloto-agent1-main-recall.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Mini Loto Agent1 Main recall research'
          git pull --rebase origin main
          git push origin HEAD:main
