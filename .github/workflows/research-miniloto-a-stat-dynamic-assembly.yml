name: Research Mini Loto A-Stat Dynamic Assembly
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_a_stat_dynamic_assembly.py'
      - '.github/workflows/research-miniloto-a-stat-dynamic-assembly.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_a_stat_dynamic_assembly.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-a-stat-dynamic-assembly-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A-Stat Dynamic assembly research'
          git pull --rebase origin main
          git push origin HEAD:main
