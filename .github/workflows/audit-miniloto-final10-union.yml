name: Audit Mini Loto Final10 union

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/audit_miniloto_final10_union.py'
      - '.github/workflows/audit-miniloto-final10-union.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-final10-union-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_final10_union.py
      - name: Commit audit result
        run: |
          FILE=data/miniloto-final10-union-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m 'Update Mini Loto Final10 union audit'
          git pull --rebase origin main
          git push origin HEAD:main
# trigger: 2026-08-25 full audit
