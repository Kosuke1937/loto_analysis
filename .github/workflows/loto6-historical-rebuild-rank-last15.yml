name: Loto6 Historical Rebuild Rank Last15
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_historical_rebuild_rank_last15.py'
      - '.github/workflows/loto6-historical-rebuild-rank-last15.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_historical_rebuild_rank_last15.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-historical-rebuild-rank-last15
          path: research/results/loto6_historical_rebuild_rank_last15.json
