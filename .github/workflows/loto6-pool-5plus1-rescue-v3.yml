name: Loto6 Pool 5plus1 Rescue v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_pool_5plus1_rescue_v3.py'
      - '.github/workflows/loto6-pool-5plus1-rescue-v3.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run 5+1 rescue diagnostic
        run: python research/loto6_pool_5plus1_rescue_v3.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-pool-5plus1-rescue-v3-result
          path: research/results/loto6_pool_5plus1_rescue_v3_summary.json
