name: Analyze Mini Loto 1402 Rebuild Generations
on:
  push:
    paths:
      - 'scripts/analyze_miniloto_1402_rebuild_generations.py'
      - '.github/workflows/analyze-miniloto-1402-rebuild-generations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/analyze_miniloto_1402_rebuild_generations.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-1402-rebuild-generations.json
          git diff --cached --quiet || git commit -m 'Analyze Mini Loto 1402 rebuild generations'
          git push
