name: Export Mini Loto specialist CSV
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/export_miniloto_specialist_csv.py'
      - '.github/workflows/export-miniloto-specialist-csv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export_miniloto_specialist_csv.py
      - name: Commit CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-specialist-traces-1200-1399.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Update Mini Loto specialist traces CSV'
          git push origin HEAD:main
