name: Audit Mini Loto Assembly vNext Portfolio
on:
  push:
    paths:
      - 'scripts/audit_miniloto_assembly_vnext_portfolio.py'
      - '.github/workflows/audit-miniloto-assembly-vnext-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_assembly_vnext_portfolio.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-assembly-vnext-portfolio-audit.json
          git diff --cached --quiet || git commit -m 'Audit Mini Loto Assembly vNext portfolio'
          git push
