name: Loto6 Reduced Pool Shape Diag v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_reduced_pool_shape_diag_v2.py'
      - '.github/workflows/loto6-reduced-pool-shape-diag-v2.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run wider pool and shape diagnostic
        run: python research/loto6_reduced_pool_shape_diag_v2.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-reduced-pool-shape-diag-v2-result
          path: research/results/loto6_reduced_pool_shape_diag_v2_summary.json
