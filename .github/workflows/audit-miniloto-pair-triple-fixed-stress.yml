name: Audit Mini Loto Pair Triple Fixed Stress
on:
  push:
    paths:
      - 'scripts/audit_miniloto_pair_triple_fixed_stress.py'
      - '.github/workflows/audit-miniloto-pair-triple-fixed-stress.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_pair_triple_fixed_stress.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-pair-triple-fixed-stress.json
          git diff --cached --quiet || git commit -m 'Audit Mini Loto pair triple fixed stress'
          git push
