name: Loto6 2138 band layer candidates
on:
  push:
    paths:
      - 'research/loto6_2138_band_layer_candidates.py'
      - '.github/workflows/loto6-2138-band-layer-candidates.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_2138_band_layer_candidates.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results/loto6_2138_band_layer_candidates.json
          git diff --cached --quiet || (git commit -m 'Add 2138 band layer candidate results' && git push)
