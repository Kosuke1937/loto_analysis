name: Research Mini Loto A Nearhit Ranks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_miniloto_a_nearhit_ranks.py'
      - '.github/workflows/research-miniloto-a-nearhit-ranks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_a_nearhit_ranks.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add data/miniloto-a-nearhit-ranks-800-1399.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A near-hit rank research'
          git pull --rebase origin main
          git push origin HEAD:main
