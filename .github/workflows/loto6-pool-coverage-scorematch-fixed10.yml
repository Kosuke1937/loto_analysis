name: Loto6 Pool Coverage Scorematch Fixed10
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_pool_coverage_scorematch_compare_fixed10.py'
      - '.github/workflows/loto6-pool-coverage-scorematch-fixed10.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_pool_coverage_scorematch_compare_fixed10.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-pool-coverage-scorematch-fixed10
          path: research/results/loto6_pool_coverage_scorematch_compare.json
