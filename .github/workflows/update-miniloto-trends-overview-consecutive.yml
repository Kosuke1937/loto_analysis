name: Update Mini Loto Trends Overview Consecutive
on:
  push:
    paths:
      - 'scripts/update_miniloto_trends_overview_consecutive.py'
      - '.github/workflows/update-miniloto-trends-overview-consecutive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/update_miniloto_trends_overview_consecutive.py
      - name: Commit app update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniloto-trends.html
          git diff --cached --quiet || git commit -m 'Show consecutive info in Mini Loto overview'
          git push
