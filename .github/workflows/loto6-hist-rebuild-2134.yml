name: Loto6 Hist Rebuild 2134
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_hist_rebuild_2134.py'
      - '.github/workflows/loto6-hist-rebuild-2134.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_hist_rebuild_2134.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-hist-rebuild-2134
          path: research/results/loto6_hist_rebuild_2134.json
