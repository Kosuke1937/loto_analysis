name: Audit Mini Loto 1402 Initial Depth
on:
  push:
    paths:
      - 'scripts/audit_miniloto_1402_initial_depth.py'
      - '.github/workflows/audit-miniloto-1402-initial-depth.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/audit_miniloto_1402_initial_depth.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-1402-initial-depth.json
          git diff --cached --quiet || git commit -m 'Audit Mini Loto 1402 initial depth'
          git push
