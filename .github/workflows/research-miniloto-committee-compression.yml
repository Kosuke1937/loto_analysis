name: Research Mini Loto committee compression

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/research_miniloto_committee_compression.py'
      - '.github/workflows/research-miniloto-committee-compression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miniloto-committee-compression
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/research_miniloto_committee_compression.py
      - name: Commit diagnostic result
        run: |
          FILE=data/miniloto-committee-compression-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
            exit 0
          fi
          git commit -m 'Update Mini Loto committee compression diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
