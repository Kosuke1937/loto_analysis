name: Loto6 2137 Result Audit
on:
  push:
    paths:
      - 'research/loto6_2137_result_audit.py'
      - '.github/workflows/loto6-2137-result-audit.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/loto6_2137_result_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-2137-result-audit
          path: research/results/loto6_2137_result_audit.json
