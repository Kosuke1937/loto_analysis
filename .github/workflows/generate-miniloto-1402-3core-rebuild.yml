name: Generate Mini Loto 1402 3core Rebuild
on:
  push:
    paths:
      - 'scripts/generate_miniloto_1402_3core_rebuild.py'
      - '.github/workflows/generate-miniloto-1402-3core-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python scripts/generate_miniloto_1402_3core_rebuild.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/miniloto-1402-3core-rebuild.json
          git diff --cached --quiet || git commit -m 'Generate Mini Loto 1402 3-core rebuild'
          git push
