name: Loto6 Consensus Phase3 Split

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/loto6_consensus_phase3_split_runner.py'
      - '.github/workflows/loto6-consensus-phase3-split.yml'

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: dev
            start: 1628
            end: 1877
          - part: holdout
            start: 1878
            end: 2127
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run Phase3 split
        env:
          PH3_START: ${{ matrix.start }}
          PH3_END: ${{ matrix.end }}
        run: python research/loto6_consensus_phase3_split_runner.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-phase3-${{ matrix.part }}
          path: research/results/loto6_consensus_phase3_cascade_${{ matrix.start }}_${{ matrix.end }}.json
