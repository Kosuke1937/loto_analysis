<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ロト分析ダッシュボード</title><style>:root{--bg:#050608;--panel:#181a1f;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--blue:#4a7fe5;--amber:#e5a32a;--green:#2fb36f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:780px;margin:auto;padding:16px 13px 36px}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:26px;font-weight:800}.version{font-size:10px;color:#cdd5e2;border:1px solid var(--line);background:#111418;border-radius:999px;padding:5px 8px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.switch button{border:1px solid var(--line);background:#111418;color:#cdd5e2;border-radius:13px;padding:10px;font-weight:800}.switch button.active{background:#202835;border-color:#4c6385;color:#fff}.game{display:none}.game.active{display:block}.card{background:linear-gradient(180deg,#1d1f24,#17191e);border:1px solid rgba(255,255,255,.05);border-radius:17px;padding:13px 14px;margin-top:10px}.label{font-size:11px;color:var(--muted);margin-bottom:7px}.balls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.ball{width:29px;height:29px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#232730;border:1px solid #343b46;font-weight:800;font-size:12px}.bonus{color:#ffd17b;background:#3a2e16;border-color:#8d6c2c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#12151a;border:1px solid #252b34;border-radius:14px;padding:11px}.stat .n{font-size:20px;font-weight:800}.stat .t{font-size:10px;color:var(--muted)}.btn{display:block;text-decoration:none;color:#fff;background:#263245;border:1px solid #3f526e;border-radius:13px;padding:11px 13px;margin-top:10px;font-size:13px;font-weight:800;text-align:center}.note{font-size:10px;color:#909aaa;margin-top:8px}.positive{color:#7be0aa}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="titleRow"><div class="title">ロト分析</div><div class="version">App v0.11.4</div></div><div class="sub">当選履歴・分析・モデル開発・購入実績｜更新 2026/08/20</div><div class="switch"><button id="miniBtn" class="active" onclick="showGame('mini')">ミニロト</button><button id="loto6Btn" onclick="showGame('loto6')">ロト6</button></div><section id="mini" class="game active"><div class="card"><div class="label">最新 第1400回｜2026/08/18</div><div class="balls"><span class="ball">01</span><span class="ball">14</span><span class="ball">15</span><span class="ball">17</span><span class="ball">29</span><span style="font-size:10px;color:var(--muted)">B</span><span class="ball bonus">30</span></div></div><div class="stats"><div class="stat"><div class="n">¥2,000</div><div class="t">累積投資額</div></div><div class="stat"><div class="n positive">¥1,100</div><div class="t">累積当選額</div></div><div class="stat"><div class="n positive">55.0%</div><div class="t">回収率</div></div></div><a class="btn" href="miniloto.html?v=0.11.4">ミニロトを開く</a><div class="note">第1400回：10口購入。6口目が本数字3個一致で4等、1,100円。</div></section><section id="loto6" class="game"><div class="card"><div class="label">最新 第2129回｜2026/08/17</div><div class="balls"><span class="ball">02</span><span class="ball">04</span><span class="ball">06</span><span class="ball">16</span><span class="ball">25</span><span class="ball">41</span><span style="font-size:10px;color:var(--muted)">B</span><span class="ball bonus">40</span></div></div><div class="stats"><div class="stat"><div class="n">¥0</div><div class="t">累積投資額</div></div><div class="stat"><div class="n">¥0</div><div class="t">累積当選額</div></div><div class="stat"><div class="n">—</div><div class="t">回収率</div></div></div><a class="btn" href="loto6.html?v=0.11.4">ロト6を開く</a><div class="note">傾向分析に期間内一覧・帯構成・合計/連番・数字傾向の表を追加。</div></section></div><script>function showGame(g){document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('active'));document.getElementById(g).classList.add('active');document.getElementById(g==='mini'?'miniBtn':'loto6Btn').classList.add('active')}</script></body></html>
