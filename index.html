<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ロト分析ダッシュボード</title><style>:root{--bg:#050608;--panel:#181a1f;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--blue:#4a7fe5;--amber:#e5a32a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:780px;margin:auto;padding:16px 13px 36px}.title{font-size:26px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.switch button{border:1px solid var(--line);background:#111418;color:#cdd5e2;border-radius:13px;padding:10px;font-weight:800}.switch button.active{background:#202835;border-color:#4c6385;color:#fff}.game{display:none}.game.active{display:block}.card{background:linear-gradient(180deg,#1d1f24,#17191e);border:1px solid rgba(255,255,255,.05);border-radius:17px;padding:13px 14px;margin-top:10px}.label{font-size:11px;color:var(--muted);margin-bottom:7px}.balls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.ball{width:29px;height:29px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#232730;border:1px solid #343b46;font-weight:800;font-size:12px}.bonus{color:#ffd17b;background:#3a2e16;border-color:#8d6c2c}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#12151a;border:1px solid #252b34;border-radius:14px;padding:11px}.stat .n{font-size:21px;font-weight:800}.stat .t{font-size:10px;color:var(--muted)}.btn{display:block;text-decoration:none;color:#fff;background:#263245;border:1px solid #3f526e;border-radius:13px;padding:11px 13px;margin-top:10px;font-size:13px;font-weight:800;text-align:center}.note{font-size:10px;color:#909aaa;margin-top:8px}</style></head><body><div class="wrap"><div class="title">ロト分析</div><div class="sub">当選履歴・分析・モデル開発・購入実績</div><div class="switch"><button id="miniBtn" class="active" onclick="showGame('mini')">ミニロト</button><button id="loto6Btn" onclick="showGame('loto6')">ロト6</button></div><section id="mini" class="game active"><div class="card"><div class="label">最新 第1400回｜2026/08/18</div><div class="balls"><span class="ball">01</span><span class="ball">14</span><span class="ball">15</span><span class="ball">17</span><span class="ball">29</span><span style="font-size:10px;color:var(--muted)">B</span><span class="ball bonus">30</span></div></div><div class="stats"><div class="stat"><div class="n">¥0</div><div class="t">累積投資額</div></div><div class="stat"><div class="n">¥0</div><div class="t">累積当選額</div></div></div><a class="btn" href="miniloto.html">ミニロトを開く</a><div class="note">購入記録の登録開始前のため金額は0円表示です。</div></section><section id="loto6" class="game"><div class="card"><div class="label">最終確認済み 第2128回｜2026/08/13</div><div class="balls"><span class="ball">13</span><span class="ball">20</span><span class="ball">22</span><span class="ball">27</span><span class="ball">35</span><span class="ball">38</span><span style="font-size:10px;color:var(--muted)">B</span><span class="ball bonus">11</span></div></div><div class="stats"><div class="stat"><div class="n">¥0</div><div class="t">累積投資額</div></div><div class="stat"><div class="n">¥0</div><div class="t">累積当選額</div></div></div><div class="card"><div class="label">ロト6</div><div style="font-size:13px">ページ構成はミニロト完成後に追加します。</div></div></section></div><script>function showGame(g){document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('active'));document.getElementById(g).classList.add('active');document.getElementById(g==='mini'?'miniBtn':'loto6Btn').classList.add('active')}</script></body></html>
