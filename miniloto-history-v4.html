<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ミニロト 過去当選番号一覧</title><style>:root{--bg:#050608;--line:#242931;--text:#f3f6fb;--muted:#aeb7c7;--green:#32a86b;--amber:#e5a32a;--blue:#4a7fe5;--red:#d55a69}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}body{line-height:1.4}.wrap{max-width:1100px;margin:auto;padding:14px 10px 34px}.nav{display:flex;gap:7px}.nav a{color:#dce4f0;text-decoration:none;border:1px solid #2b3039;background:#111418;border-radius:999px;padding:7px 11px;font-size:11px}.title{font-size:23px;font-weight:800;margin-top:13px}.sub{font-size:11px;color:var(--muted);margin:3px 0 10px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.chip{border:1px solid #2b3039;background:#111418;color:#cdd5e2;border-radius:999px;padding:7px 10px;font-size:11px}.chip.active{background:#202835;border-color:#4b5f7f;color:#fff}input,select{background:#111418;color:#fff;border:1px solid #2b3039;border-radius:10px;padding:8px 9px;font-size:11px}.search{flex:1;min-width:170px}.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:#b7c0cd;margin:8px 2px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%}.note{font-size:10px;color:var(--muted);background:#101318;border:1px solid #202630;border-radius:12px;padding:9px 10px;margin:8px 0}.status{font-size:10px;color:var(--muted);margin:7px 2px}.tablewrap{overflow:auto;border:1px solid #222831;border-radius:12px;max-height:74vh;-webkit-overflow-scrolling:touch}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1370px;background:#090b0e}th,td{padding:8px;border-bottom:1px solid #1b2027;font-size:11px;text-align:center;white-space:nowrap}th{position:sticky;top:0;z-index:3;background:#14171c;color:#aeb7c7;font-weight:700}th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#0d0f13;text-align:left}th:first-child{z-index:4;background:#14171c}.nums{font-weight:700}.bonus{color:#ffd17b}.A{color:#70d99e;font-weight:800}.B{color:#ffd17b;font-weight:800}.C{color:#91b5ff;font-weight:800}.D{color:#ff9aa7;font-weight:800}.ok{color:#70d99e}.ng{color:#ff8d9a;font-weight:800}@media(max-width:560px){.wrap{padding:12px 8px 28px}.title{font-size:21px}th,td{padding:7px;font-size:10px}}</style></head><body><div class="wrap"><div class="nav"><a href="./?v=20260819-1050">トップ</a><a href="miniloto.html?v=20260819-1050">ミニロト</a></div><div class="title">過去当選番号一覧</div><div class="sub">第1回〜第1400回｜当選番号＋分析条件</div><div class="controls"><button class="chip active" data-range="all">全期間</button><button class="chip" data-range="20">直近20</button><button class="chip" data-range="50">直近50</button><button class="chip" data-range="100">直近100</button><button class="chip" data-range="500">直近500</button><input id="search" class="search" placeholder="回号・数字・帯構成で検索"><select id="order"><option value="desc">新しい順</option><option value="asc">古い順</option></select></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>A ≥5%</span><span><i class="dot" style="background:var(--amber)"></i>B 2–5%</span><span><i class="dot" style="background:var(--blue)"></i>C 0.5–2%</span><span><i class="dot" style="background:var(--red)"></i>D &lt;0.5%</span></div><div class="note">高低比＝1〜16 / 17〜31。帯構成＝1〜9 / 10〜19 / 20〜29 / 30〜31。前回B除外＝前回ボーナス数字を今回本数字に含めない条件の通過可否。</div><div id="status" class="status">データ準備中…</div><div class="tablewrap"><table><thead><tr><th>回</th><th>日付</th><th>本数字</th><th>B</th><th>合計</th><th>奇偶比</th><th>高低比</th><th>帯構成</th><th>層</th><th>長期頻度</th><th>連番</th><th>20番台</th><th>30/31</th><th>前回本数字再登場</th><th>前回B除外</th><th>1等口数</th><th>口数層</th></tr></thead><tbody id="body"></tbody></table></div></div><script src="data/miniloto-chunk-1.js?v=1050"></script><script src="data/miniloto-chunk-2.js?v=1050"></script><script src="data/miniloto-chunk-3.js?v=1050"></script><script src="data/miniloto-chunk-4.js?v=1050"></script><script src="data/miniloto-chunk-5.js?v=1050"></script><script src="data/miniloto-chunk-6.js?v=1050"></script><script src="data/miniloto-chunk-7.js?v=1050"></script><script>const DATA=(window.MINI_CHUNKS||[]).flat();let range='all';const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');function band(a){let c=[0,0,0,0];a.forEach(n=>c[n<=9?0:n<=19?1:n<=29?2:3]++);return c.join('-')}function cons(a){let p=[];for(let i=0;i<4;i++)if(a[i+1]===a[i]+1)p.push(a[i]+'-'+a[i+1]);return p.join(',')||'—'}function crowd(n){if(n==null)return'—';if(n===0)return'0口';if(n===1)return'1口';if(n<=5)return'① 2–5';if(n<=15)return'② 6–15';if(n<=49)return'③ 16–49';return'④ 50+'}function render(){const shapes={};DATA.forEach(r=>{const s=band(r.slice(2,7));shapes[s]=(shapes[s]||0)+1});let rows=DATA.map((r,i)=>{const a=r.slice(2,7),s=band(a),f=100*shapes[s]/DATA.length,l=f>=5?'A':f>=2?'B':f>=.5?'C':'D',odd=a.filter(n=>n%2).length,lo=a.filter(n=>n<=16).length,tw=a.filter(n=>n>=20&&n<=29).length,th=a.filter(n=>n>=30).length,prev=i?DATA[i-1].slice(2,7):[],ov=a.filter(n=>prev.includes(n)).length,pb=i?DATA[i-1][7]:null,pass=pb===null?'—':a.includes(pb)?'×':'○';return{r,a,s,f,l,sum:a.reduce((x,y)=>x+y,0),oe:odd+':'+(5-odd),hl:lo+':'+(5-lo),co:cons(a),tw,th,ov,pass,crowd:crowd(r[8])}});if(range!=='all')rows=rows.slice(-Number(range));const sc=$('search').value.trim();if(sc)rows=rows.filter(x=>[x.r[0],x.r[1],x.a.join(' '),x.s,x.l,x.sum].join(' ').includes(sc));if($('order').value==='desc')rows.reverse();$('status').textContent=rows.length.toLocaleString()+'件表示 / 元データ '+DATA.length.toLocaleString()+'件';$('body').innerHTML=rows.map(x=>`<tr><td>${x.r[0]}</td><td>${x.r[1]}</td><td class="nums">${x.a.map(pad).join(' ')}</td><td class="bonus">${pad(x.r[7])}</td><td>${x.sum}</td><td>${x.oe}</td><td>${x.hl}</td><td>${x.s}</td><td class="${x.l}">${x.l}</td><td>${x.f.toFixed(2)}%</td><td>${x.co}</td><td>${x.tw}</td><td>${x.th}</td><td>${x.ov}</td><td class="${x.pass==='○'?'ok':x.pass==='×'?'ng':''}">${x.pass}</td><td>${x.r[8]??'—'}</td><td>${x.crowd}</td></tr>`).join('')}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;render()});$('search').oninput=render;$('order').onchange=render;if(DATA.length!==1400){$('status').textContent='データ不完全: '+DATA.length+'件';}else{render();}</script></body></html>
