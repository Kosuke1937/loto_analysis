<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ミニロト 当選番号傾向分析</title><style>:root{--bg:#050608;--panel:#181a1f;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--green:#32a86b;--amber:#e5a32a;--blue:#4a7fe5;--red:#d55a69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.45}.wrap{max-width:820px;margin:auto;padding:14px 12px 34px}.nav{display:flex;gap:7px}.nav a{color:#dce4f0;text-decoration:none;border:1px solid var(--line);background:#111418;border-radius:999px;padding:8px 12px;font-size:12px}.title{font-size:25px;font-weight:800;margin-top:14px}.sub{font-size:12px;color:var(--muted);margin:4px 0 12px}.periods,.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.chip,.tab{border:1px solid var(--line);background:#111418;color:#c9d1df;border-radius:999px;padding:9px 13px;font-size:12px;white-space:nowrap}.chip.active,.tab.active{background:#202835;border-color:#4b5f7f;color:#fff}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:#181a1f;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:13px}.wide{grid-column:1/-1}.label{font-size:11px;color:var(--muted)}.n{font-size:22px;font-weight:800;margin-top:3px}.small{font-size:13px;color:#dce2eb}.section{font-size:15px;font-weight:800;margin:18px 2px 8px}.helper{font-size:11px;color:var(--muted);margin:0 2px 8px}.chart{width:100%;position:relative;overflow:visible;touch-action:pan-y}.chart svg{width:100%;height:auto;display:block}.axis{fill:#c4ccd8;font-size:14px;font-weight:650}.gridline{stroke:#29313c;stroke-width:1}.plot-hit{fill:transparent;stroke:transparent;pointer-events:all}.plot-tip{position:absolute;z-index:20;display:none;pointer-events:none;background:#20242b;border:1px solid #465064;border-radius:10px;padding:8px 10px;color:#fff;font-size:12px;white-space:nowrap;transform:translate(-50%,-112%)}.plot-tip.show{display:block}.tablewrap{overflow:auto;border:1px solid #222831;border-radius:13px}table{border-collapse:collapse;width:100%;min-width:580px;background:#0d0f13}th,td{padding:9px 10px;border-bottom:1px solid #1d222a;font-size:12px;text-align:right;white-space:nowrap}th{background:#15181d;color:#b8c0cd}th:first-child,td:first-child{text-align:left}.barrow{display:grid;grid-template-columns:42px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:12px}.bar{height:10px;background:#14181d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#8298be}.digitgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.digitcard{background:#12151a;border:1px solid #242a33;border-radius:14px;padding:11px}.digithead{display:flex;justify-content:space-between}.digit{font-size:20px;font-weight:800}.digitmeta{font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:11px;color:var(--muted);margin:4px 2px 10px}@media(max-width:560px){.axis{font-size:15px}.title{font-size:23px}}</style></head><body><div class="wrap"><div class="nav"><a href="./?v=20260819-1950">トップ</a><a href="miniloto.html?v=20260819-1950">ミニロト</a></div><div class="title">当選番号傾向分析</div><div class="sub">抽選結果そのものの傾向を確認。アルゴリズム性能は「開発進捗」に分離。</div><div class="periods"><button class="chip active" data-n="20">直近20</button><button class="chip" data-n="50">直近50</button><button class="chip" data-n="100">直近100</button><button class="chip" data-n="500">直近500</button><button class="chip" data-n="all">全期間</button></div><div id="status" class="status"></div><div class="tabs"><button class="tab active" data-tab="overview">概況</button><button class="tab" data-tab="band">帯構成</button><button class="tab" data-tab="sum">合計・連番</button><button class="tab" data-tab="number">数字傾向</button></div><section id="overview" class="page active"><div class="grid" id="overviewKpi"></div><div class="section">期間内一覧</div><div class="tablewrap"><table><thead><tr><th>回</th><th>本数字</th><th>帯構成</th><th>合計</th><th>連番</th></tr></thead><tbody id="recentBody"></tbody></table></div></section><section id="band" class="page"><div class="section">帯構成ランキング</div><div class="helper">帯＝1–9 / 10–19 / 20–29 / 30–31</div><div class="tablewrap"><table><thead><tr><th>帯構成</th><th>期間内回数</th><th>期間内比率</th><th>長期頻度</th></tr></thead><tbody id="bandBody"></tbody></table></div></section><section id="sum" class="page"><div class="grid" id="sumKpi"></div><div class="section">合計値推移</div><div class="helper">1回タップで固定表示。グラフ外タップで閉じます。</div><div id="sumChart" class="chart"></div><div class="section">合計値帯</div><div id="sumBins"></div><div class="section">連番</div><div class="grid" id="consecKpi"></div></section><section id="number" class="page"><div class="grid" id="numberKpi"></div><div class="section">数字別出現回数</div><div id="numberBars"></div><div class="section">下一桁傾向</div><div class="helper">0〜9の下一桁別。候補数差を補うため1数字あたり平均も表示。</div><div id="digitGrid" class="digitgrid"></div></section></div><script src="data/miniloto-chunk-1.js?v=1950"></script><script src="data/miniloto-chunk-2.js?v=1950"></script><script src="data/miniloto-chunk-3.js?v=1950"></script><script src="data/miniloto-chunk-4.js?v=1950"></script><script src="data/miniloto-chunk-5.js?v=1950"></script><script src="data/miniloto-chunk-6.js?v=1950"></script><script src="data/miniloto-chunk-7.js?v=1950"></script><script>const DATA=(window.MINI_CHUNKS||[]).flat(),$=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');let period=20;function band(a){let c=[0,0,0,0];a.forEach(n=>c[n<=9?0:n<=19?1:n<=29?2:3]++);return c.join('-')}function cons(a){let p=[];for(let i=0;i<4;i++)if(a[i+1]===a[i]+1)p.push(a[i]+'-'+a[i+1]);return p}function med(a){let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}const allShapes={};DATA.forEach(r=>{let s=band(r.slice(2,7));allShapes[s]=(allShapes[s]||0)+1});function rows(){let d=period==='all'?DATA:DATA.slice(-period);return d.map(r=>{let a=r.slice(2,7);return{r,a,s:band(a),sum:a.reduce((x,y)=>x+y,0),cp:cons(a)}})}function tip(el){let t=document.createElement('div');t.className='plot-tip';el.appendChild(t);let locked=false;el.querySelectorAll('.plot-hit').forEach(h=>h.addEventListener('click',e=>{e.stopPropagation();locked=true;t.innerHTML=h.dataset.tip;t.style.left=h.dataset.l+'%';t.style.top=h.dataset.t+'%';t.classList.add('show')}));document.addEventListener('click',e=>{if(!el.contains(e.target)){locked=false;t.classList.remove('show')}})}function line(R){const W=720,H=400,L=52,Rt=14,T=18,B=30,pw=W-L-Rt,ph=H-T-B,maxY=140;let s='';[50,80,110,140].forEach(v=>{let y=T+ph-v/maxY*ph;s+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-Rt}" y2="${y}"/><text class="axis" x="${L-9}" y="${y+5}" text-anchor="end">${v}</text>`});let step=Math.max(1,Math.ceil(R.length/100)),V=R.filter((_,i)=>i%step===0||i===R.length-1),pts=V.map((d,i)=>({x:L+i*pw/Math.max(1,V.length-1),y:T+ph-d.sum/maxY*ph,d}));s+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#e0e6ef" stroke-width="3"/>`;pts.forEach((p,i)=>{let lp=100*p.x/W,tp=100*p.y/H;s+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#e0e6ef"/><circle class="plot-hit" data-l="${lp}" data-t="${tp}" data-tip="第${p.d.r[0]}回<br>${p.d.a.map(pad).join('・')}<br>合計 ${p.d.sum}" cx="${p.x}" cy="${p.y}" r="16"/>`;if(V.length<=25||i%Math.ceil(V.length/20)===0||i===V.length-1)s+=`<text class="axis" x="${p.x}" y="${T+ph+22}" text-anchor="middle">${String(p.d.r[0]).slice(-2)}</text>`});$('sumChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;tip($('sumChart'))}function render(){let R=rows(),N=R.length;$('status').textContent=`${R[0].r[0]}〜${R[N-1].r[0]}回｜${N}回`;let sums=R.map(x=>x.sum),avg=sums.reduce((a,b)=>a+b,0)/N;$('overviewKpi').innerHTML=`<div class="card"><div class="label">合計平均</div><div class="n">${avg.toFixed(1)}</div></div><div class="card"><div class="label">連番あり</div><div class="n">${R.filter(x=>x.cp.length).length}/${N}</div></div>`;$('recentBody').innerHTML=R.slice().reverse().slice(0,period==='all'?100:N).map(x=>`<tr><td>${x.r[0]}</td><td>${x.a.map(pad).join(' ')}</td><td>${x.s}</td><td>${x.sum}</td><td>${x.cp.join(',')||'—'}</td></tr>`).join('');let sc={};R.forEach(x=>sc[x.s]=(sc[x.s]||0)+1);$('bandBody').innerHTML=Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<tr><td>${s}</td><td>${n}</td><td>${(100*n/N).toFixed(1)}%</td><td>${(100*(allShapes[s]||0)/DATA.length).toFixed(2)}%</td></tr>`).join('');$('sumKpi').innerHTML=`<div class="card"><div class="label">平均</div><div class="n">${avg.toFixed(1)}</div></div><div class="card"><div class="label">中央値</div><div class="n">${med(sums).toFixed(1)}</div></div><div class="card"><div class="label">最小</div><div class="n">${Math.min(...sums)}</div></div><div class="card"><div class="label">最大</div><div class="n">${Math.max(...sums)}</div></div>`;line(R);let bins=[[0,59],[60,79],[80,99],[100,119],[120,139],[140,999]].map(([a,b])=>({a,b,n:sums.filter(v=>v>=a&&v<=b).length}));$('sumBins').innerHTML=bins.map(x=>`<div class="barrow"><span>${x.b===999?x.a+'+':x.a+'–'+x.b}</span><div class="bar"><i style="width:${100*x.n/N}%"></i></div><b>${x.n}</b></div>`).join('');let cr=R.filter(x=>x.cp.length).length;$('consecKpi').innerHTML=`<div class="card"><div class="label">連番あり</div><div class="n">${cr}/${N}</div><div class="small">${(100*cr/N).toFixed(1)}%</div></div><div class="card"><div class="label">連番ペア総数</div><div class="n">${R.reduce((z,x)=>z+x.cp.length,0)}</div></div>`;let f=Array(32).fill(0);R.forEach(x=>x.a.forEach(n=>f[n]++));let nr=Array.from({length:31},(_,i)=>({n:i+1,c:f[i+1]})).sort((a,b)=>b.c-a.c||a.n-b.n),mx=nr[0].c;$('numberBars').innerHTML=nr.map(x=>`<div class="barrow"><span>${pad(x.n)}</span><div class="bar"><i style="width:${100*x.c/mx}%"></i></div><b>${x.c}</b></div>`).join('');$('numberKpi').innerHTML=`<div class="card"><div class="label">最多数字</div><div class="n">${pad(nr[0].n)}</div><div class="small">${nr[0].c}回</div></div><div class="card"><div class="label">最少数字</div><div class="n">${pad(nr[nr.length-1].n)}</div><div class="small">${nr[nr.length-1].c}回</div></div>`;let dc=Array(10).fill(0),members=Array.from({length:10},(_,d)=>Array.from({length:31},(_,i)=>i+1).filter(n=>n%10===d));R.forEach(x=>x.a.forEach(n=>dc[n%10]++));$('digitGrid').innerHTML=dc.map((c,d)=>`<div class="digitcard"><div class="digithead"><span class="digit">${d}</span><b>${c}回</b></div><div class="digitmeta">構成比 ${(100*c/(N*5)).toFixed(1)}%｜1数字平均 ${(c/members[d].length).toFixed(2)}回</div><div class="digitmeta">${members[d].map(pad).join('・')}</div></div>`).join('')}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.n==='all'?'all':Number(b.dataset.n);render()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});if(DATA.length===1400)render();else $('status').textContent='データ不完全: '+DATA.length+'件';</script></body></html>
