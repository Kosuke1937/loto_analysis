<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ミニロト 当選番号傾向分析</title><style>:root{--bg:#050608;--panel:#181a1f;--panel2:#20232a;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--green:#32a86b;--amber:#e5a32a;--blue:#4a7fe5;--red:#d55a69}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}body{line-height:1.42}.wrap{max-width:780px;margin:auto;padding:14px 12px 32px}.nav{display:flex;gap:7px}.nav a{color:#dce4f0;text-decoration:none;border:1px solid var(--line);background:#111418;border-radius:999px;padding:7px 11px;font-size:11px}.title{font-size:24px;font-weight:800;margin-top:14px}.sub{font-size:11px;color:var(--muted);margin:3px 0 10px}.tab-radio{position:absolute;left:-9999px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}.tab{display:block;border:1px solid var(--line);background:#111418;color:#c9d1df;border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap;cursor:pointer}.page{display:none}#t20:checked~.tabs label[for=t20],#tband:checked~.tabs label[for=tband],#tsum:checked~.tabs label[for=tsum],#texact:checked~.tabs label[for=texact]{background:#202835;border-color:#4b5f7f;color:#fff}#t20:checked~.pages #p20,#tband:checked~.pages #pband,#tsum:checked~.pages #psum,#texact:checked~.pages #pexact{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:linear-gradient(180deg,#1d1f24,#17191e);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px}.wide{grid-column:1/-1}.label{font-size:10px;color:var(--muted)}.n{font-size:20px;font-weight:800;margin-top:3px}.small{font-size:12px;color:#dce2eb}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:10px 2px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%}.section{font-size:13px;font-weight:800;margin:15px 2px 7px}.helper{font-size:10px;color:var(--muted);margin:0 2px 7px}.chart{width:100%;overflow:auto}.chart svg{width:100%;height:auto;display:block}.axis{fill:#9fa8b7;font-size:9px}.gridline{stroke:#242a34;stroke-width:1}.tablewrap{overflow:auto;border:1px solid #222831;border-radius:13px}table{border-collapse:collapse;width:100%;min-width:520px;background:#0d0f13}th,td{padding:8px 9px;border-bottom:1px solid #1d222a;font-size:11px;text-align:right;white-space:nowrap}th{background:#15181d;color:#aeb7c7}th:first-child,td:first-child{text-align:left}.A{color:#70d99e}.B{color:#ffd17b}.C{color:#91b5ff}.D{color:#ff9aa7}.note{font-size:11px;color:#cfd6e1;background:#101318;border:1px solid #202630;border-radius:13px;padding:10px 11px;margin-top:10px}.controls{display:flex;gap:7px;align-items:center;margin-bottom:8px}select{background:#111418;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:11px}@media(max-width:560px){.n{font-size:18px}.title{font-size:22px}}</style></head><body><div class="wrap"><div class="nav"><a href="./?v=20260819-1247">トップ</a><a href="miniloto.html?v=20260819-1247">ミニロト</a></div><div class="title">当選番号傾向分析</div><div class="sub">分析項目をタブで切り替え</div><input class="tab-radio" type="radio" name="tabs" id="t20" checked><input class="tab-radio" type="radio" name="tabs" id="tband"><input class="tab-radio" type="radio" name="tabs" id="tsum"><input class="tab-radio" type="radio" name="tabs" id="texact"><div class="tabs"><label class="tab" for="t20">直近20回</label><label class="tab" for="tband">帯構成</label><label class="tab" for="tsum">合計・連番</label><label class="tab" for="texact">Exact-Core</label></div><div class="pages"><section id="p20" class="page"><div class="grid" id="layerCards"></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>A ≥5%</span><span><i class="dot" style="background:var(--amber)"></i>B 2–5%</span><span><i class="dot" style="background:var(--blue)"></i>C 0.5–2%</span><span><i class="dot" style="background:var(--red)"></i>D &lt;0.5%</span></div><div class="section">直近20回の帯構成頻度</div><div class="helper">各回の帯構成が長期でどれくらい出ているか</div><div id="freqChart" class="chart"></div><div class="section">直近20回一覧</div><div class="tablewrap"><table><thead><tr><th>回</th><th>本数字</th><th>帯構成</th><th>層</th><th>合計</th></tr></thead><tbody id="recentBody"></tbody></table></div></section><section id="pband" class="page"><div class="grid" id="bandKpi"></div><div class="section">帯構成ランキング</div><div class="helper">帯＝1–9 / 10–19 / 20–29 / 30–31</div><div class="tablewrap"><table><thead><tr><th>帯構成</th><th>回数</th><th>頻度</th><th>層</th></tr></thead><tbody id="bandBody"></tbody></table></div></section><section id="psum" class="page"><div class="grid" id="sumKpi"></div><div class="section">合計値推移</div><div class="helper">直近20回</div><div id="sumChart" class="chart"></div><div class="section">連番</div><div class="grid" id="consecKpi"></div><div class="note" id="sumNote"></div></section><section id="pexact" class="page"><div class="grid"><div class="card"><div class="label">3個一致</div><div class="n">387</div></div><div class="card"><div class="label">4個一致</div><div class="n">22</div></div><div class="card"><div class="label">5個一致</div><div class="n">3</div></div><div class="card"><div class="label">評価範囲</div><div class="n">1–1399</div></div></div><div class="controls"><select id="exactMode"><option value="exact">ちょうど一致</option><option value="plus">○個以上一致</option><option value="cum">累積</option></select></div><div id="exactChart" class="chart"></div><div class="note">Exact-Core v1 の第1〜1399回集計。5個一致は1001〜1100回で1回、1301〜1399回で2回。</div></section></div></div><script src="data/miniloto-chunk-1.js?v=1247"></script><script src="data/miniloto-chunk-2.js?v=1247"></script><script src="data/miniloto-chunk-3.js?v=1247"></script><script src="data/miniloto-chunk-4.js?v=1247"></script><script src="data/miniloto-chunk-5.js?v=1247"></script><script src="data/miniloto-chunk-6.js?v=1247"></script><script src="data/miniloto-chunk-7.js?v=1247"></script><script>const DATA=(window.MINI_CHUNKS||[]).flat();const C={A:'#32a86b',B:'#e5a32a',C:'#4a7fe5',D:'#d55a69'};const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');function band(a){let c=[0,0,0,0];a.forEach(n=>c[n<=9?0:n<=19?1:n<=29?2:3]++);return c.join('-')}function layer(f){return f>=5?'A':f>=2?'B':f>=.5?'C':'D'}function cons(a){let p=[];for(let i=0;i<4;i++)if(a[i+1]===a[i]+1)p.push(a[i]+'-'+a[i+1]);return p}const shapes={};DATA.forEach(r=>{const s=band(r.slice(2,7));shapes[s]=(shapes[s]||0)+1});const recent=DATA.slice(-20).map(r=>{const a=r.slice(2,7),s=band(a),f=100*shapes[s]/DATA.length;return{r,a,s,f,l:layer(f),sum:a.reduce((x,y)=>x+y,0),cp:cons(a)}});const lc={A:0,B:0,C:0,D:0};recent.forEach(x=>lc[x.l]++);$('layerCards').innerHTML=['A','B','C','D'].map(k=>`<div class="card"><div class="label">${k}層</div><div class="n">${lc[k]}回</div></div>`).join('');$('recentBody').innerHTML=recent.slice().reverse().map(x=>`<tr><td>${x.r[0]}</td><td>${x.a.map(pad).join(' ')}</td><td>${x.s}</td><td class="${x.l}">${x.l}</td><td>${x.sum}</td></tr>`).join('');function barChart(){const W=720,H=210,L=24,R=8,T=8,B=30,pw=W-L-R,ph=H-T-B,max=10;let s='';[0,2,5,10].forEach(v=>{const y=T+ph-v/max*ph;s+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="2" y="${y+3}">${v}%</text>`});recent.forEach((d,i)=>{const gap=pw/recent.length,bw=gap*.46,x=L+i*gap+(gap-bw)/2,h=ph*d.f/max,y=T+ph-h;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${C[d.l]}"></rect><text class="axis" x="${x+bw/2}" y="${H-9}" text-anchor="middle">${String(d.r[0]).slice(-2)}</text>`});$('freqChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}barChart();const ranked=Object.entries(shapes).map(([s,n])=>({s,n,f:100*n/DATA.length,l:layer(100*n/DATA.length)})).sort((a,b)=>b.n-a.n);const ac=ranked.filter(x=>x.l==='A').reduce((z,x)=>z+x.n,0),bc=ranked.filter(x=>x.l==='B').reduce((z,x)=>z+x.n,0);$('bandKpi').innerHTML=`<div class="card"><div class="label">A層</div><div class="n">${(100*ac/DATA.length).toFixed(2)}%</div></div><div class="card"><div class="label">B層</div><div class="n">${(100*bc/DATA.length).toFixed(2)}%</div></div><div class="card wide"><div class="label">A+B</div><div class="n">${(100*(ac+bc)/DATA.length).toFixed(2)}%</div></div>`;$('bandBody').innerHTML=ranked.map(x=>`<tr><td>${x.s}</td><td>${x.n}</td><td>${x.f.toFixed(2)}%</td><td class="${x.l}">${x.l}</td></tr>`).join('');const sums=recent.map(x=>x.sum),avg=sums.reduce((a,b)=>a+b,0)/sums.length,sorted=[...sums].sort((a,b)=>a-b),med=(sorted[9]+sorted[10])/2,min=Math.min(...sums),max=Math.max(...sums);$('sumKpi').innerHTML=`<div class="card"><div class="label">平均</div><div class="n">${avg.toFixed(1)}</div></div><div class="card"><div class="label">中央値</div><div class="n">${med.toFixed(1)}</div></div><div class="card"><div class="label">最小</div><div class="n">${min}</div></div><div class="card"><div class="label">最大</div><div class="n">${max}</div></div>`;function lineChart(){const W=720,H=210,L=24,R=8,T=8,B=30,pw=W-L-R,ph=H-T-B,maxY=140;let s='';[50,80,110,140].forEach(v=>{const y=T+ph-v/maxY*ph;s+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="2" y="${y+3}">${v}</text>`});const pts=recent.map((d,i)=>({x:L+i*pw/(recent.length-1),y:T+ph-d.sum/maxY*ph,d}));s+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#d6dce6" stroke-width="2"/>`;pts.forEach(p=>s+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#d6dce6"></circle><text class="axis" x="${p.x}" y="${H-9}" text-anchor="middle">${String(p.d.r[0]).slice(-2)}</text>`);$('sumChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}lineChart();const cc=recent.filter(x=>x.cp.length>0).length,totalPairs=recent.reduce((z,x)=>z+x.cp.length,0);$('consecKpi').innerHTML=`<div class="card"><div class="label">連番あり</div><div class="n">${cc}/20</div></div><div class="card"><div class="label">連番ペア総数</div><div class="n">${totalPairs}</div></div>`;$('sumNote').textContent=`直近20回の合計平均 ${avg.toFixed(1)}、中央値 ${med.toFixed(1)}。連番ありは ${cc} 回。`;const EX=[['1–100',28,1,0],['101–200',25,0,0],['201–300',30,1,0],['301–400',30,1,0],['401–500',31,2,0],['501–600',31,5,0],['601–700',22,1,0],['701–800',25,0,0],['801–900',25,3,0],['901–1000',25,3,0],['1001–1100',30,0,1],['1101–1200',30,2,0],['1201–1300',23,1,0],['1301–1399',32,2,2]];function exactChart(){const mode=$('exactMode').value;let c=[0,0,0];const d=EX.map(r=>{let v;if(mode==='exact')v=[r[1],r[2],r[3]];else if(mode==='plus')v=[r[1]+r[2]+r[3],r[2]+r[3],r[3]];else{c=[c[0]+r[1],c[1]+r[2],c[2]+r[3]];v=[...c]}return{b:r[0],v}});const ymax=Math.ceil(Math.max(...d.flatMap(x=>x.v))/5)*5,W=720,H=230,L=24,R=8,T=8,B=45,pw=W-L-R,ph=H-T-B;let s='';[0,.25,.5,.75,1].forEach(q=>{const v=Math.round(ymax*q),y=T+ph-v/ymax*ph;s+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="2" y="${y+3}">${v}</text>`});[['#4a7fe5',0],['#32a86b',1],['#d55a69',2]].forEach(([col,k])=>{const pts=d.map((x,i)=>({x:L+i*pw/(d.length-1),y:T+ph-x.v[k]/ymax*ph}));s+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`;pts.forEach(p=>s+=`<circle cx="${p.x}" cy="${p.y}" r="2.7" fill="${col}"></circle>`)});d.forEach((x,i)=>{const xx=L+i*pw/(d.length-1);s+=`<text class="axis" x="${xx}" y="${H-10}" text-anchor="end" transform="rotate(-32 ${xx} ${H-10})">${x.b}</text>`});$('exactChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}$('exactMode').onchange=exactChart;exactChart();</script></body></html>
