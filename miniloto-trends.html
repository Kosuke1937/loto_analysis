<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ミニロト 当選番号傾向分析</title><style>:root{--bg:#050608;--panel:#181a1f;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--green:#32a86b;--amber:#e5a32a;--blue:#4a7fe5;--red:#d55a69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.45}.wrap{max-width:820px;margin:auto;padding:14px 12px 36px}.nav{display:flex;gap:7px}.nav a{color:#dce4f0;text-decoration:none;border:1px solid var(--line);background:#111418;border-radius:999px;padding:8px 12px;font-size:12px}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.title{font-size:25px;font-weight:800}.version{font-size:10px;color:#d5deea;border:1px solid var(--line);background:#111418;border-radius:999px;padding:5px 8px}.sub{font-size:12px;color:var(--muted);margin:4px 0 12px}.periods,.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.chip,.tab{border:1px solid var(--line);background:#111418;color:#c9d1df;border-radius:999px;padding:9px 13px;font-size:12px;white-space:nowrap}.chip.active,.tab.active{background:#202835;border-color:#4b5f7f;color:#fff}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:13px}.label{font-size:11px;color:var(--muted)}.n{font-size:22px;font-weight:800;margin-top:3px}.small{font-size:12px;color:#dce2eb}.section{font-size:16px;font-weight:800;margin:18px 2px 8px}.helper{font-size:11px;color:var(--muted);margin:0 2px 8px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 2px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.chart{width:100%;touch-action:pan-y}.chart svg{width:100%;height:auto;display:block}.axis{fill:#c4ccd8;font-size:13px;font-weight:650}.gridline{stroke:#29313c;stroke-width:1}.tablewrap{overflow:auto;border:1px solid #222831;border-radius:13px}table{border-collapse:collapse;width:100%;min-width:580px;background:#0d0f13}th,td{padding:9px 10px;border-bottom:1px solid #1d222a;font-size:12px;text-align:right;white-space:nowrap}th{background:#15181d;color:#b8c0cd}th:first-child,td:first-child{text-align:left}.barrow{display:grid;grid-template-columns:48px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:12px}.bar{height:10px;background:#14181d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#8298be}.digitgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.digitcard{background:#12151a;border:1px solid #242a33;border-radius:14px;padding:11px}.digithead{display:flex;justify-content:space-between}.digit{font-size:20px;font-weight:800}.digitmeta{font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:11px;color:var(--muted);margin:4px 2px 10px}.selectedBox{border:2px solid #fff;border-radius:13px;background:#0f1216;padding:10px 12px;margin:10px 0 2px;font-size:12px;line-height:1.65}.footer{font-size:10px;color:#768296;text-align:center;margin-top:26px}@media(max-width:560px){.axis{font-size:14px}.title{font-size:23px}.n{font-size:20px}}</style></head><body><div class="wrap"><div class="nav"><a href="./?v=0.12.1">トップ</a><a href="miniloto.html?v=0.12.1">ミニロト</a></div><div class="titleRow"><div class="title">当選番号傾向分析</div><div class="version">App v0.12.1</div></div><div class="sub">第1402回まで反映。表示期間の抽選結果を動的集計。</div><div class="periods" id="periods"><button class="chip active" data-n="20">直近20</button><button class="chip" data-n="50">直近50</button><button class="chip" data-n="100">直近100</button><button class="chip" data-n="500">直近500</button><button class="chip" data-n="0">全期間</button></div><div id="status" class="status"></div><div class="tabs"><button class="tab active" data-tab="overview">概況</button><button class="tab" data-tab="band">帯構成</button><button class="tab" data-tab="sum">合計・連番</button><button class="tab" data-tab="number">数字傾向</button></div><section id="overview" class="page active"><div class="grid" id="overviewKpi"></div><div class="section">ABCD層 × 帯構成頻度</div><div class="helper">帯＝1–9 / 10–19 / 20–29 / 30–31。層分類は全1402回の長期頻度。</div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>A ≥5%</span><span><i class="dot" style="background:var(--amber)"></i>B 2–5%</span><span><i class="dot" style="background:var(--blue)"></i>C 0.5–2%</span><span><i class="dot" style="background:var(--red)"></i>D &lt;0.5%</span></div><div id="freqChart" class="chart"></div><div class="section">合計値推移</div><div class="helper">上下グラフは同じ回を白枠＋白線で同期選択。</div><div id="sumChart" class="chart"></div><div id="selectedBox" class="selectedBox"></div><div class="section">期間内一覧</div><div class="tablewrap"><table><thead><tr><th>回</th><th>本数字</th><th>帯構成</th><th>層</th><th>長期頻度</th><th>合計</th></tr></thead><tbody id="recentBody"></tbody></table></div></section><section id="band" class="page"><div class="section">帯構成ランキング</div><div class="tablewrap"><table><thead><tr><th>帯構成</th><th>期間内回数</th><th>期間内比率</th><th>長期頻度</th><th>層</th></tr></thead><tbody id="bandBody"></tbody></table></div></section><section id="sum" class="page"><div class="grid" id="sumKpi"></div><div class="section">合計値帯</div><div id="sumBins"></div><div class="section">連番</div><div class="grid" id="consecKpi"></div></section><section id="number" class="page"><div class="grid" id="numberKpi"></div><div class="section">数字別出現回数</div><div id="numberBars"></div><div class="section">下一桁傾向</div><div id="digitGrid" class="digitgrid"></div></section><div class="footer">Loto Analysis App v0.12.1</div></div><script src="data/miniloto-chunk-1.js?v=0.12.1"></script><script src="data/miniloto-chunk-2.js?v=0.12.1"></script><script src="data/miniloto-chunk-3.js?v=0.12.1"></script><script src="data/miniloto-chunk-4.js?v=0.12.1"></script><script src="data/miniloto-chunk-5.js?v=0.12.1"></script><script src="data/miniloto-chunk-6.js?v=0.12.1"></script><script src="data/miniloto-chunk-7.js?v=0.12.1"></script><script src="data/miniloto-chunk-8.js?v=0.12.1-1402"></script><script>const DATA=(window.MINI_CHUNKS||[]).flat(),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),COL={A:'#32a86b',B:'#e5a32a',C:'#4a7fe5',D:'#d55a69'};let period=20,selectedDraw=DATA.at(-1)?.[0]||null;function band(a){let c=[0,0,0,0];a.forEach(n=>c[n<=9?0:n<=19?1:n<=29?2:3]++);return c.join('-')}function layer(f){return f>=5?'A':f>=2?'B':f>=.5?'C':'D'}function cons(a){let p=[];for(let i=1;i<a.length;i++)if(a[i]===a[i-1]+1)p.push(a[i-1]+'-'+a[i]);return p}function med(a){let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}const shapes={};DATA.forEach(r=>{let s=band(r.slice(2,7));shapes[s]=(shapes[s]||0)+1});function rows(){let d=period?DATA.slice(-period):DATA;return d.map(r=>{let a=r.slice(2,7),s=band(a),f=100*(shapes[s]||0)/DATA.length;return{r,a,s,f,l:layer(f),sum:a.reduce((x,y)=>x+y,0),cp:cons(a)}})}function tick(n){return n<=20?1:n<=50?2:n<=100?5:n<=500?25:70}function xlab(a,x,y,t){a.push(`<text class="axis" x="${x}" y="${y}" text-anchor="end" transform="rotate(-58 ${x} ${y})">${t}</text>`)}function choose(draw){selectedDraw=draw;renderCharts(rows());showSelected()}function showSelected(){let d=rows().find(x=>x.r[0]===selectedDraw);if(d)$('selectedBox').innerHTML=`<b>第${d.r[0]}回</b>　${d.a.map(pad).join('・')}<br>合計 ${d.sum}｜帯構成 ${d.s}｜${d.l}層｜長期頻度 ${d.f.toFixed(2)}%${d.cp.length?'<br>連番 '+d.cp.join(' / '):''}`}function bind(root){root.querySelectorAll('[data-d]').forEach(e=>e.onpointerup=()=>choose(+e.dataset.d))}function renderCharts(R){let W=760,H=350,L=55,Rt=15,T=16,B=88,pw=W-L-Rt,ph=H-T-B,x=i=>L+i*pw/Math.max(1,R.length-1),a=[],st=tick(R.length);[0,2,5,10].forEach(v=>{let y=T+ph-v/10*ph;a.push(`<line class="gridline" x1="${L}" y1="${y}" x2="${W-Rt}" y2="${y}"/><text class="axis" x="${L-7}" y="${y+4}" text-anchor="end">${v}%</text>`)});R.forEach((d,i)=>{let gap=pw/R.length,bw=Math.max(3,gap*.62),h=ph*Math.min(d.f,10)/10,y=T+ph-h,cx=x(i),sel=d.r[0]===selectedDraw;a.push(`<rect data-d="${d.r[0]}" x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" fill="${COL[d.l]}" ${sel?'stroke="#fff" stroke-width="4"':''}/>`);if(sel)a.push(`<line x1="${cx}" x2="${cx}" y1="${T}" y2="${T+ph}" stroke="#fff" stroke-width="3"/>`);if(i%st===0||i===R.length-1)xlab(a,cx,H-18,d.r[0])});$('freqChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${a.join('')}</svg>`;bind($('freqChart'));let H2=390,T2=18,B2=88,ph2=H2-T2-B2,lo=40,hi=150,b=[],y2=v=>T2+(hi-v)/(hi-lo)*ph2;[50,80,110,140].forEach(v=>{let yy=y2(v);b.push(`<line class="gridline" x1="${L}" y1="${yy}" x2="${W-Rt}" y2="${yy}"/><text class="axis" x="${L-7}" y="${yy+4}" text-anchor="end">${v}</text>`)});let pts=R.map((d,i)=>[x(i),y2(d.sum),d]);b.push(`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#e0e6ef" stroke-width="2.5"/>`);pts.forEach((p,i)=>{let sel=p[2].r[0]===selectedDraw;if(sel)b.push(`<line x1="${p[0]}" x2="${p[0]}" y1="${T2}" y2="${T2+ph2}" stroke="#fff" stroke-width="3"/>`);b.push(`<circle data-d="${p[2].r[0]}" cx="${p[0]}" cy="${p[1]}" r="${sel?7:4}" fill="#e0e6ef" ${sel?'stroke="#fff" stroke-width="4"':''}/>`);if(i%st===0||i===R.length-1)xlab(b,p[0],H2-18,p[2].r[0])});$('sumChart').innerHTML=`<svg viewBox="0 0 ${W} ${H2}">${b.join('')}</svg>`;bind($('sumChart'))}function render(){let R=rows(),N=R.length;if(!R.some(x=>x.r[0]===selectedDraw))selectedDraw=R.at(-1).r[0];$('status').textContent=`表示 第${R[0].r[0]}〜第${R.at(-1).r[0]}回｜${N}回 / 全${DATA.length}回`;let lc={A:0,B:0,C:0,D:0};R.forEach(x=>lc[x.l]++);$('overviewKpi').innerHTML=['A','B','C','D'].map(k=>`<div class="card"><div class="label">${k}層</div><div class="n">${lc[k]}回</div><div class="small">${(100*lc[k]/N).toFixed(1)}%</div></div>`).join('');renderCharts(R);showSelected();$('recentBody').innerHTML=[...R].reverse().map(x=>`<tr><td>第${x.r[0]}</td><td>${x.a.map(pad).join(' ')}</td><td>${x.s}</td><td style="color:${COL[x.l]}">${x.l}</td><td>${x.f.toFixed(2)}%</td><td>${x.sum}</td></tr>`).join('');let sc={};R.forEach(x=>sc[x.s]=(sc[x.s]||0)+1);$('bandBody').innerHTML=Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([s,n])=>{let f=100*(shapes[s]||0)/DATA.length,l=layer(f);return `<tr><td>${s}</td><td>${n}</td><td>${(100*n/N).toFixed(1)}%</td><td>${f.toFixed(2)}%</td><td style="color:${COL[l]}">${l}</td></tr>`}).join('');let sums=R.map(x=>x.sum),avg=sums.reduce((a,b)=>a+b,0)/N;$('sumKpi').innerHTML=`<div class="card"><div class="label">平均</div><div class="n">${avg.toFixed(1)}</div></div><div class="card"><div class="label">中央値</div><div class="n">${med(sums).toFixed(1)}</div></div><div class="card"><div class="label">最小</div><div class="n">${Math.min(...sums)}</div></div><div class="card"><div class="label">最大</div><div class="n">${Math.max(...sums)}</div></div>`;let bins=[[0,59],[60,79],[80,99],[100,119],[120,139],[140,999]].map(([a,b])=>({a,b,n:sums.filter(v=>v>=a&&v<=b).length}));$('sumBins').innerHTML=bins.map(z=>`<div class="barrow"><span>${z.b===999?z.a+'+':z.a+'–'+z.b}</span><div class="bar"><i style="width:${100*z.n/N}%"></i></div><b>${z.n}</b></div>`).join('');let cc=R.filter(x=>x.cp.length).length;$('consecKpi').innerHTML=`<div class="card"><div class="label">連番あり</div><div class="n">${cc}/${N}</div><div class="small">${(100*cc/N).toFixed(1)}%</div></div><div class="card"><div class="label">連番ペア総数</div><div class="n">${R.reduce((a,x)=>a+x.cp.length,0)}</div></div>`;let f=Array(32).fill(0);R.forEach(x=>x.a.forEach(n=>f[n]++));let nr=Array.from({length:31},(_,i)=>({n:i+1,c:f[i+1]})).sort((a,b)=>b.c-a.c||a.n-b.n),mx=nr[0].c;$('numberBars').innerHTML=nr.map(z=>`<div class="barrow"><span>${pad(z.n)}</span><div class="bar"><i style="width:${100*z.c/mx}%"></i></div><b>${z.c}</b></div>`).join('');$('numberKpi').innerHTML=`<div class="card"><div class="label">最多数字</div><div class="n">${pad(nr[0].n)}</div><div class="small">${nr[0].c}回</div></div><div class="card"><div class="label">最少数字</div><div class="n">${pad(nr.at(-1).n)}</div><div class="small">${nr.at(-1).c}回</div></div>`;let dc=Array(10).fill(0),members=Array.from({length:10},(_,d)=>Array.from({length:31},(_,i)=>i+1).filter(n=>n%10===d));R.forEach(x=>x.a.forEach(n=>dc[n%10]++));$('digitGrid').innerHTML=dc.map((c,d)=>`<div class="digitcard"><div class="digithead"><span class="digit">${d}</span><b>${c}回</b></div><div class="digitmeta">構成比 ${(100*c/(N*5)).toFixed(1)}%｜1数字平均 ${(c/members[d].length).toFixed(2)}回</div></div>`).join('')}document.querySelectorAll('#periods .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periods .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=+b.dataset.n;render()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});if(DATA.length===1401)render();else $('status').textContent=`データ不完全: ${DATA.length}件`;</script></body></html>
