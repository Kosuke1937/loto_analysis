<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ロト6 当選番号傾向</title><style>:root{--bg:#050608;--panel:#181a1f;--line:#2b3039;--text:#f3f6fb;--muted:#aeb7c7;--green:#32a86b;--amber:#e5a32a;--blue:#4a7fe5;--red:#d55a69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:820px;margin:auto;padding:15px 13px 40px}.nav{display:flex;gap:7px}.nav a{color:#dce4f0;text-decoration:none;border:1px solid var(--line);background:#111418;border-radius:999px;padding:8px 12px;font-size:12px}.titleRow{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.title{font-size:25px;font-weight:800}.version{font-size:10px;color:#cdd5e2;border:1px solid var(--line);background:#111418;border-radius:999px;padding:5px 8px}.sub,.helper{font-size:11px;color:var(--muted);margin-top:4px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls button{border:1px solid var(--line);background:#111418;color:#dce4f0;border-radius:999px;padding:8px 11px;font-size:11px}.controls button.active{background:#253248;border-color:#4a6387}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:13px}.label{font-size:11px;color:var(--muted)}.n{font-size:21px;font-weight:800;margin-top:3px}.section{font-size:17px;font-weight:800;margin:22px 2px 8px}.chart{width:100%;touch-action:pan-y}.chart svg{width:100%;height:auto;display:block}.axis{fill:#c4ccd8;font-size:12px;font-weight:650}.gridline{stroke:#29313c;stroke-width:1}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:6px 2px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.selectedBox{border:2px solid #fff;border-radius:13px;padding:10px 12px;margin-top:8px;background:#0f1216;font-size:12px;line-height:1.7}.footer{font-size:10px;color:#768296;text-align:center;margin-top:26px}</style></head><body><div class="wrap"><div class="nav"><a href="./">トップ</a><a href="loto6.html">ロト6</a></div><div class="titleRow"><div class="title">当選番号傾向分析</div><div class="version">App v0.11.1</div></div><div class="sub">第1〜2129回を動的集計</div><div class="controls" id="periods"><button data-n="20" class="active">直近20</button><button data-n="50">直近50</button><button data-n="100">直近100</button><button data-n="500">直近500</button><button data-n="0">全期間</button></div><div class="grid" id="kpi"></div><div class="section">ABCD層 × 帯構成頻度</div><div class="helper">帯構成は1–9 / 10–19 / 20–29 / 30–39 / 40–43。ABCDは全履歴の帯構成頻度で分類（A≥2%, B=1–2%, C=0.5–1%, D&lt;0.5%）。縦軸は0〜5%に固定。タップした回は白枠＋白線で固定表示。</div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>A</span><span><i class="dot" style="background:var(--amber)"></i>B</span><span><i class="dot" style="background:var(--blue)"></i>C</span><span><i class="dot" style="background:var(--red)"></i>D</span></div><div id="freqChart" class="chart"></div><div class="section">合計値推移</div><div id="sumChart" class="chart"></div><div id="sel" class="selectedBox"></div><div class="section">数字出現回数</div><div class="helper">棒をタップするとその数字を白枠で選択。</div><div id="numChart" class="chart"></div><div class="footer">Loto Analysis App v0.11.1</div></div><script src="data/loto6-chunk-1.js"></script><script src="data/loto6-chunk-2.js"></script><script src="data/loto6-chunk-3.js"></script><script src="data/loto6-chunk-4.js"></script><script src="data/loto6-chunk-5.js"></script><script src="data/loto6-chunk-6.js"></script><script src="data/loto6-chunk-7.js"></script><script src="data/loto6-chunk-8.js"></script><script src="data/loto6-chunk-9.js"></script><script src="data/loto6-chunk-10.js"></script><script src="data/loto6-chunk-11.js"></script><script>const $=x=>document.getElementById(x),COL={A:'#32a86b',B:'#e5a32a',C:'#4a7fe5',D:'#d55a69'};const DATA=(window.LOTO6_CHUNKS||[]).flat().map(r=>({draw:r[0],date:r[1],nums:r.slice(2,8),bonus:r[8]}));let N=20,selected=null,selectedNum=null;const shape=a=>[a.filter(x=>x<=9).length,a.filter(x=>x>=10&&x<=19).length,a.filter(x=>x>=20&&x<=29).length,a.filter(x=>x>=30&&x<=39).length,a.filter(x=>x>=40).length].join('-');const allFreq={};DATA.forEach(d=>allFreq[shape(d.nums)]=(allFreq[shape(d.nums)]||0)+1);const freq=s=>100*(allFreq[s]||0)/DATA.length,layer=f=>f>=2?'A':f>=1?'B':f>=.5?'C':'D';function rows(){return N?DATA.slice(-N):DATA}function detail(d){let s=shape(d.nums),f=freq(s);$('sel').innerHTML=`<b>第${d.draw}回</b><br>本数字 ${d.nums.map(x=>String(x).padStart(2,'0')).join('・')} / B ${String(d.bonus).padStart(2,'0')}<br>合計 ${d.nums.reduce((a,b)=>a+b,0)} / 帯構成 ${s} / ${layer(f)}層 / 長期頻度 ${f.toFixed(2)}%`}function choose(draw){selected=draw;let d=DATA.find(x=>x.draw===draw);if(d)detail(d);highlight()}function highlight(){['freqChart','sumChart'].forEach(id=>{$(id).querySelectorAll('[data-d]').forEach(e=>{let on=+e.dataset.d===selected;e.setAttribute('stroke',on?'#fff':'none');e.setAttribute('stroke-width',on?'4':'0')});$(id).querySelectorAll('.selLine').forEach(e=>e.remove());let hit=$(id).querySelector(`[data-d="${selected}"]`);if(hit){let svg=$(id).querySelector('svg'),x=hit.tagName==='circle'?+hit.getAttribute('cx'):+hit.getAttribute('x')+(+hit.getAttribute('width')||0)/2;let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','selLine');line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('y1','12');line.setAttribute('y2',id==='freqChart'?'255':'238');line.setAttribute('stroke','#fff');line.setAttribute('stroke-width','3');line.setAttribute('pointer-events','none');svg.appendChild(line)}});$('numChart').querySelectorAll('[data-n]').forEach(e=>{let on=+e.dataset.n===selectedNum;e.setAttribute('stroke',on?'#fff':'none');e.setAttribute('stroke-width',on?'4':'0')})}function render(){let R=rows(),sums=R.map(d=>d.nums.reduce((a,b)=>a+b,0)),avg=Math.round(sums.reduce((a,b)=>a+b,0)/R.length),cons=R.filter(d=>d.nums.some((v,i,a)=>i&&v===a[i-1]+1)).length;$('kpi').innerHTML=`<div class="card"><div class="label">対象</div><div class="n">${R.length}回</div></div><div class="card"><div class="label">平均合計</div><div class="n">${avg}</div></div><div class="card"><div class="label">連番あり</div><div class="n">${cons}回</div></div><div class="card"><div class="label">32〜43を2個以上</div><div class="n">${R.filter(d=>d.nums.filter(x=>x>=32).length>=2).length}回</div></div>`;if(!selected||!R.some(d=>d.draw===selected))selected=R.at(-1).draw;bars(R);line(R);nums(R);detail(DATA.find(x=>x.draw===selected));highlight()}function xlab(a,x,y,t){a.push(`<text class="axis" x="${x}" y="${y}" text-anchor="end" transform="rotate(-58 ${x} ${y})">${t}</text>`)}function bw(g){return Math.max(3,g*.62)}function bars(R){let W=760,H=350,L=56,T=16,B=95,pw=W-L-12,ph=H-T-B,MAXF=5,a=[];[0,1,2,3,4,5].forEach(v=>{let y=T+ph-v/MAXF*ph;a.push(`<line class="gridline" x1="${L}" y1="${y}" x2="${W-12}" y2="${y}"/><text class="axis" x="${L-7}" y="${y+4}" text-anchor="end">${v}%</text>`)});let step=Math.max(1,Math.ceil(R.length/50));R.forEach((d,i)=>{let gap=pw/R.length,x=L+i*gap+bw(gap)/2,s=shape(d.nums),f=freq(s),h=Math.min(f,MAXF)/MAXF*ph,y=T+ph-h,w=bw(gap);a.push(`<rect data-d="${d.draw}" x="${x-w/2}" y="${y}" width="${w}" height="${h}" fill="${COL[layer(f)]}"/>`);if(i%step===0||i===R.length-1)xlab(a,x,H-20,d.draw)});$('freqChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${a.join('')}</svg>`;$('freqChart').querySelectorAll('[data-d]').forEach(e=>e.onpointerup=()=>choose(+e.dataset.d))}function line(R){let W=760,H=330,L=56,T=18,B=92,pw=W-L-12,ph=H-T-B,lo=60,hi=210,a=[],x=i=>L+i*pw/Math.max(1,R.length-1),y=v=>T+(hi-v)/(hi-lo)*ph;[75,100,125,150,175,200].forEach(v=>{let yy=y(v);a.push(`<line class="gridline" x1="${L}" y1="${yy}" x2="${W-12}" y2="${yy}"/><text class="axis" x="${L-7}" y="${yy+4}" text-anchor="end">${v}</text>`)});let p=R.map((d,i)=>[x(i),y(d.nums.reduce((a,b)=>a+b,0))]);a.push(`<polyline points="${p.map(z=>z.join(',')).join(' ')}" fill="none" stroke="#4a7fe5" stroke-width="2"/>`);let step=Math.max(1,Math.ceil(R.length/50));p.forEach((z,i)=>{a.push(`<circle data-d="${R[i].draw}" cx="${z[0]}" cy="${z[1]}" r="4" fill="#4a7fe5"/>`);if(i%step===0||i===R.length-1)xlab(a,z[0],H-20,R[i].draw)});$('sumChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${a.join('')}</svg>`;$('sumChart').querySelectorAll('[data-d]').forEach(e=>e.onpointerup=()=>choose(+e.dataset.d))}function nums(R){let c=Array(44).fill(0);R.forEach(d=>d.nums.forEach(n=>c[n]++));let W=760,H=300,L=42,T=15,B=48,pw=W-L-10,ph=H-T-B,m=Math.max(...c),a=[];for(let n=1;n<=43;n++){let gap=pw/43,w=Math.max(3,gap*.65),x=L+(n-1)*gap,h=c[n]/m*ph,y=T+ph-h;a.push(`<rect data-n="${n}" x="${x}" y="${y}" width="${w}" height="${h}" fill="#4a7fe5"/><text class="axis" x="${x+w/2}" y="${H-18}" text-anchor="middle">${n%2?n:''}</text>`)}$('numChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${a.join('')}</svg>`;$('numChart').querySelectorAll('[data-n]').forEach(e=>e.onpointerup=()=>{selectedNum=+e.dataset.n;highlight()})}document.querySelectorAll('#periods button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periods button').forEach(x=>x.classList.remove('active'));b.classList.add('active');N=+b.dataset.n;selected=null;selectedNum=null;render()});render();</script></body></html>
